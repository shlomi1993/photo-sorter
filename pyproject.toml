[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-sorting"
version = "1.0.0"
description = "Fix photo/video metadata dates based on directory naming convention"
authors = [{name = "Shlomi Ben Shushan"}]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: System :: Archiving",
]
dependencies = [
    "Pillow>=9.0.0",
    "mutagen>=1.45.0",
    "colorama>=0.4.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "flake8>=3.8",
]

[project.scripts]
photo-sorting = "photo_sorting.cli:main"

[project.urls]
Homepage = "https://github.com/shlomibenshushan/photo-sorting"
Repository = "https://github.com/shlomibenshushan/photo-sorting.git"
Issues = "https://github.com/shlomibenshushan/photo-sorting/issues"

[tool.setuptools.packages.find]
include = ["photo_sorting*"]

[tool.setuptools.package-data]
photo_sorting = ["*.md", "*.txt"]
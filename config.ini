# Photo Sorting Tool Configuration
# 
# This file contains default settings for the photo sorting tool.
# You can modify these values to customize the tool's behavior.

[DEFAULT]
# Default behavior settings
dry_run = false
backup = true
verbose = false

# File extensions to process (comma-separated, no spaces)
image_extensions = .jpg,.jpeg,.png,.tiff,.tif,.bmp,.webp
video_extensions = .mp4,.mov,.avi,.mkv,.wmv,.flv,.webm,.m4v

# Date validation settings
min_year = 1980
max_year = 2030

# Logging settings
log_to_file = false
log_file_path = ~/.photo_sorting/logs/photo_sorting.log
log_level = INFO

[METADATA]
# Which metadata fields to update (true/false)
update_exif_datetime = true
update_exif_datetime_original = true
update_exif_datetime_digitized = true
update_file_timestamps = true
update_video_metadata = true

# Metadata update strategy
# strict: Only update if all metadata is consistent
# permissive: Update any metadata that differs from expected date
# selective: Update only if difference is significant (configurable threshold)
update_strategy = permissive

# For selective strategy: threshold in days
significant_difference_days = 7

[PATHS]
# Default paths (modify as needed for your setup)
# photos_root = /Users/shlomibenshushan/Library/CloudStorage/OneDrive-Personal/Photos
# backup_location = ~/.photo_sorting/backups

[PLATFORM]
# Platform-specific optimizations
optimize_for_android = true
optimize_for_google_photos = true
optimize_for_windows_photos = true
optimize_for_macos_photos = true